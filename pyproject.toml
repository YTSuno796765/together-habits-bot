[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "together-habits-bot"
version = "0.1.0"
description = "Telegram bot for shared habits with a friend, couple habits with a mood tracker, and personal habits."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot[job-queue]>=21.0,<22.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
together-habits-bot = "together_habits.__main__:main"

[tool.setuptools]
packages = ["together_habits"]

[tool.pytest.ini_options]
testpaths = ["tests"]
